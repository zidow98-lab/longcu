<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>龙粗账本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#202735;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}[hidden]{display:none!important}
.nav{background:#fff;border-bottom:1px solid #dfe4eb;display:flex;align-items:center;gap:24px;min-height:64px;padding:0 max(20px,calc((100vw - 1240px)/2));position:sticky;top:0;z-index:2}.brand{font-weight:750;font-size:18px;white-space:nowrap}.tabs{display:flex;gap:8px}.tab{border:0;background:none;padding:20px 14px;color:#687487;border-bottom:3px solid transparent;white-space:nowrap}.tab[aria-selected="true"]{color:#2255cc;border-bottom-color:#2255cc;font-weight:700}
main{max-width:1280px;margin:auto;padding:28px 20px 48px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}h1{font-size:22px;margin:0;font-weight:750}h2{font-size:15px;margin:0 0 16px}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #dce2ea;border-radius:6px;background:#fff;color:#344156;padding:7px 12px;min-height:36px;white-space:nowrap}.btn:hover{background:#f3f6fa}.primary{background:#2454d6;border-color:#2454d6;color:#fff}.primary:hover{background:#1945bd}.danger{color:#c13737;background:#fff5f5;border-color:#f4dede}.btn.small{padding:4px 9px;min-height:30px;font-size:12px}
input,select{border:1px solid #d9e0ea;background:#fff;color:#202735;border-radius:6px;padding:9px 11px;min-width:0;max-width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid #5185f2;outline-offset:2px}input[type=number]{appearance:textfield}input::-webkit-inner-spin-button{appearance:none}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#637086;font-weight:600}.entry{display:grid;grid-template-columns:minmax(180px,2fr) minmax(120px,1fr) minmax(120px,1fr) auto;gap:14px;align-items:end;padding:20px 0 24px;border-top:1px solid #dce2ea;border-bottom:1px solid #dce2ea}.entry .btn{height:41px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}.toolbar input{width:260px}.toolbar select{width:128px}.count{margin-left:auto;color:#758195;font-size:12px}
.table-scroll{overflow-x:auto;border:1px solid #e1e6ed;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:740px}th{background:#f7f9fb;font-size:12px;color:#6a778a;text-align:left;padding:12px 16px;font-weight:600}td{border-top:1px solid #edf0f4;padding:10px 12px;height:62px;vertical-align:middle}th:first-child{width:31%}th:nth-child(2),th:nth-child(3){width:18%}th:nth-child(4){width:15%}th:nth-child(5){width:10%}th:last-child{width:8%}.cell-input{width:100%;border-color:transparent;padding:7px 4px;background:transparent}.cell-input:hover{border-color:#dce2ea}.cell-input:focus{border-color:#5185f2;background:#fff}.amount{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}.positive{color:#13825a}.negative{color:#cc3c43}.muted{color:#8a96a7}.status{display:inline-block;border-radius:4px;padding:3px 7px;font-size:12px;white-space:nowrap}.held{background:#fff2d5;color:#93620a}.sold{background:#e5f5ed;color:#15754e}.empty{text-align:center;color:#8390a2;padding:48px 16px}.total-line{display:flex;gap:24px;flex-wrap:wrap;justify-content:flex-end;color:#667387;font-size:12px;padding-top:14px}.total-line strong{font-size:14px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:20px;background:#fff;border:1px solid #e1e6ed;border-radius:8px;border-top:3px solid #5287e4;min-width:0}.stat:nth-child(2){border-top-color:#e1ad45}.stat:nth-child(3){border-top-color:#54a68a}.stat:nth-child(4){border-top-color:#a19ab9}.stat-label{font-size:12px;color:#68768b}.stat-value{font-size:24px;font-weight:750;margin:12px 0 6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.stat-sub{font-size:12px;color:#8894a4}.dashboard-bottom{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:30px;padding-top:24px;border-top:1px solid #dce2ea}.bar-row{margin:20px 0}.bar-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;color:#647186;font-size:13px}.bar-track{height:9px;background:#e0e6ef;border-radius:4px;overflow:hidden}.bar-fill{height:100%;background:#5b87d9;border-radius:4px}.bar-fill.green{background:#46a384}.recent-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e0e6ec}.recent-name{min-width:0;overflow-wrap:anywhere}.recent-name small{display:block;color:#8491a4;margin-top:3px}.notice{padding:12px 16px;background:#fff0e8;color:#a04724;border:1px solid #efd4c4;border-radius:6px;margin-bottom:16px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#273344;color:#fff;padding:10px 18px;border-radius:6px;max-width:calc(100vw - 24px);z-index:5;font-size:13px}.footer{margin-top:30px;color:#8a95a5;font-size:12px}
@media(max-width:760px){.nav{padding:0 16px;gap:16px}.brand{font-size:16px}.tab{padding:17px 10px}main{padding:20px 16px 40px}.entry{grid-template-columns:1fr 1fr;gap:12px}.entry .field:first-child{grid-column:1/-1}.entry .btn{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat-value{font-size:20px}.dashboard-bottom{grid-template-columns:1fr;gap:24px}.count{width:100%;margin:0}.toolbar input{flex:1;width:160px}.heading{align-items:flex-start}.total-line{justify-content:flex-start;gap:8px 18px}}
</style>
</head>
<body>
<nav class="nav"><div class="brand">龙粗账本</div><div class="tabs" role="tablist" aria-label="视图"><button class="tab" id="tab-details" role="tab" aria-selected="true" aria-controls="details">明细</button><button class="tab" id="tab-dashboard" role="tab" aria-selected="false" aria-controls="dashboard">仪表盘</button></div></nav>
<main>
<div class="heading"><h1 id="page-title">买卖明细</h1><div class="tools"><button class="btn" id="export">导出备份</button><button class="btn" id="import">导入备份</button><input type="file" id="import-file" accept=".json,application/json" hidden></div></div>
<div id="storage-warning" class="notice" role="alert" hidden></div>
<section id="details" role="tabpanel" aria-labelledby="tab-details">
<form id="add-form" class="entry">
<label class="field">名称<input name="name" aria-label="新增名称" placeholder="商品名称" required maxlength="120" autocomplete="off"></label>
<label class="field">购入金额<input name="purchase" aria-label="新增购入金额" type="number" min="0" step="0.01" placeholder="0.00" required></label>
<label class="field">出售金额<input name="sale" aria-label="新增出售金额" type="number" min="0" step="0.01" placeholder="未出售留空"></label>
<button type="submit" class="btn primary">添加记录</button>
</form>
<div class="toolbar"><input id="search" type="search" placeholder="搜索名称" aria-label="搜索名称"><select id="filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="held">持有中</option><option value="sold">已出售</option></select><span class="count" id="count"></span></div>
<div class="table-scroll"><table><thead><tr><th>名称</th><th>购入金额</th><th>出售金额</th><th>利润</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="total-line" id="list-totals"></div>
</section>
<section id="dashboard" role="tabpanel" aria-labelledby="tab-dashboard" hidden>
<div class="stats" id="stats"></div>
<div class="dashboard-bottom"><div><h2>已售收支</h2><div id="bars"></div></div><div><h2>最近录入</h2><div id="recent"></div></div></div>
</section>
<div class="footer">本地账本 · <span id="saved">尚未保存</span></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script id="simple-ledger-core">
(function(){
  'use strict';
  const MAX=999999999.99;
  function cents(value,optional=false){
    if(value===null||value===undefined||String(value).trim()===''){
      if(optional)return null;
      throw new Error('请填写购入金额');
    }
    if(!['number','string'].includes(typeof value))throw new Error('金额格式不正确');
    const text=String(value).trim();
    if(!/^\d+(?:\.\d{1,2})?$/.test(text)||Number(text)>MAX)throw new Error('金额须为非负数，最多两位小数，且不超过 999,999,999.99');
    return Math.round(Number(text)*100);
  }
  function normalize(records){
    if(!Array.isArray(records)||records.length>20000)throw new Error('备份记录格式不正确');
    const ids=new Set();
    return records.map(record=>{
      if(!record||typeof record!=='object'||typeof record.name!=='string'||!record.name.trim()||record.name.length>120)throw new Error('每条记录都需要有效名称');
      if(typeof record.id!=='string'||!record.id||ids.has(record.id))throw new Error('记录编号缺失或重复');
      ids.add(record.id);
      return {id:record.id,name:record.name.trim(),purchase:cents(record.purchase)/100,sale:cents(record.sale,true)===null?null:cents(record.sale)/100};
    });
  }
  function summary(records){
    let purchase=0,holding=0,revenue=0,soldCost=0,soldCount=0;
    for(const record of records){
      const cost=cents(record.purchase);const sale=cents(record.sale,true);purchase+=cost;
      if(sale===null)holding+=cost;else{revenue+=sale;soldCost+=cost;soldCount++;}
    }
    const heldCount=records.length-soldCount;
    return {purchase:purchase/100,holding:holding/100,revenue:revenue/100,soldCost:soldCost/100,profit:(revenue-soldCost)/100,soldCount,heldCount,count:records.length,averageHolding:heldCount?Math.round(holding/heldCount)/100:null};
  }
  window.simpleLedgerCore={cents,normalize,summary};
})();
</script>
<script>
(function(){
  'use strict';
  const KEY='friend_simple_trade_ledger_v1';
  const FORMAT='simple-trade-ledger';
  const {cents,normalize,summary}=window.simpleLedgerCore;
  const $=id=>document.getElementById(id);
  const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const money=value=>'¥'+value.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const color=value=>value>0?'positive':value<0?'negative':'';
  let records=[],locked=false,timer;
  function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2800);}
  function warning(message){$('storage-warning').textContent=message;$('storage-warning').hidden=false;}
  function payload(data){return {format:FORMAT,version:1,savedAt:new Date().toISOString(),records:data};}
  function decode(data){if(!data||data.format!==FORMAT||data.version!==1)throw new Error('请选择这个简版账本导出的 JSON 备份');return normalize(data.records);}
  function stamp(date){$('saved').textContent='已保存 '+new Date(date).toLocaleString('zh-CN',{hour12:false});}
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const saved=JSON.parse(raw);records=decode(saved);if(saved.savedAt&&Number.isFinite(Date.parse(saved.savedAt)))stamp(saved.savedAt);}
  }catch(error){locked=true;warning('本地数据未能读取，已暂停修改。请先导出原始数据，再导入有效备份。');}
  function save(next){
    if(locked){toast('请先恢复有效备份');return false;}
    try{const data=payload(normalize(next));localStorage.setItem(KEY,JSON.stringify(data));records=data.records;stamp(data.savedAt);$('storage-warning').hidden=true;return true;}
    catch(error){warning('保存失败：'+error.message);return false;}
  }
  function filtered(){const search=$('search').value.trim().toLowerCase(),filter=$('filter').value;return records.filter(record=>record.name.toLowerCase().includes(search)&&(filter==='all'||(filter==='held')===(record.sale===null)));}
  function row(record){const sold=record.sale!==null,profit=sold?(cents(record.sale)-cents(record.purchase))/100:null;return `<tr data-id="${escape(record.id)}"><td><input class="cell-input" data-field="name" aria-label="商品名称" maxlength="120" required value="${escape(record.name)}"></td><td><input class="cell-input amount" data-field="purchase" aria-label="购入金额" type="number" min="0" step="0.01" required value="${record.purchase}"></td><td><input class="cell-input amount" data-field="sale" aria-label="出售金额" type="number" min="0" step="0.01" placeholder="未出售" value="${record.sale??''}"></td><td class="amount ${profit===null?'muted':color(profit)}" data-profit>${profit===null?'—':(profit>0?'+':'')+money(profit)}</td><td data-status><span class="status ${sold?'sold':'held'}">${sold?'已出售':'持有中'}</span></td><td><button class="btn danger small" data-delete aria-label="删除 ${escape(record.name)}">删除</button></td></tr>`;}
  function totals(){const list=filtered(),sum=summary(list);$('count').textContent=`${list.length} / ${records.length} 条`;$('list-totals').innerHTML=`<span>当前筛选购入<strong>${money(sum.purchase)}</strong></span><span>持有成本<strong>${money(sum.holding)}</strong></span><span>已实现利润<strong class="${color(sum.profit)}">${money(sum.profit)}</strong></span>`;}
  function renderRows(){const list=filtered();$('rows').innerHTML=list.length?list.map(row).join(''):`<tr><td colspan="6" class="empty">${records.length?'没有匹配记录':'暂无记录'}</td></tr>`;totals();}
  function renderDashboard(){const sum=summary(records);$('stats').innerHTML=[['总个数',String(sum.count),'全部商品',''],['持有个数',String(sum.heldCount),'未出售商品',''],['平均持有价格',sum.averageHolding===null?'—':money(sum.averageHolding),sum.heldCount?'每件持有商品的平均购入金额':'暂无持有商品',''],['累计购入',money(sum.purchase),`${sum.count} 条记录`,''],['持有成本',money(sum.holding),`${sum.heldCount} 件未出售`,''],['出售金额',money(sum.revenue),`${sum.soldCount} 件已出售`,''],['已实现利润',money(sum.profit),sum.soldCount?'已出售商品盈亏':'暂无出售记录',color(sum.profit)]].map(([label,value,sub,cls])=>`<article class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div><div class="stat-sub">${sub}</div></article>`).join('');
    const max=Math.max(sum.soldCost,sum.revenue,1);
    $('bars').innerHTML=[['已售商品成本',sum.soldCost,''],['出售收入',sum.revenue,'green']].map(([label,value,cls])=>`<div class="bar-row"><div class="bar-label"><span>${label}</span><strong>${money(value)}</strong></div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${value/max*100}%"></div></div></div>`).join('');
    $('recent').innerHTML=records.length?records.slice(0,5).map(record=>`<div class="recent-row"><div class="recent-name">${escape(record.name)}<small>${record.sale===null?'持有中':'已出售'}</small></div><div class="amount ${record.sale===null?'':color(record.sale-record.purchase)}">${money(record.sale===null?record.purchase:(cents(record.sale)-cents(record.purchase))/100)}</div></div>`).join(''):'<div class="empty">暂无记录</div>';
  }
  function render(){renderRows();renderDashboard();}
  function show(view){for(const name of ['details','dashboard']){const active=name===view;$(name).hidden=!active;$('tab-'+name).setAttribute('aria-selected',String(active));}$('page-title').textContent=view==='details'?'买卖明细':'仪表盘';render();}
  for(const view of ['details','dashboard'])$('tab-'+view).addEventListener('click',()=>show(view));
  document.querySelector('.tabs').addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const view=$('details').hidden?'details':'dashboard';show(view);$('tab-'+view).focus();}});
  $('add-form').addEventListener('submit',event=>{event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;try{const fields=new FormData(form),name=String(fields.get('name')).trim();if(!name)throw new Error('请填写名称');const sale=cents(fields.get('sale'),true);const item={id:crypto.randomUUID(),name,purchase:cents(fields.get('purchase'))/100,sale:sale===null?null:sale/100};if(save([item,...records])){form.reset();$('search').value='';$('filter').value='all';render();form.elements.namedItem('name').focus();toast('已添加');}}catch(error){toast(error.message);}});
  $('rows').addEventListener('change',event=>{const input=event.target.closest('[data-field]');if(!input)return;const tr=input.closest('tr'),original=records.find(record=>record.id===tr.dataset.id),field=input.dataset.field;if(!original)return;try{if(!input.validity.valid)throw new Error('请检查输入内容');const next={...original};if(field==='name'){next.name=input.value.trim();if(!next.name)throw new Error('名称不能为空');}else{const value=cents(input.value,field==='sale');next[field]=value===null?null:value/100;}if(!save(records.map(record=>record.id===next.id?next:record))){input.value=original[field]??'';return;}input.value=next[field]??'';const profit=next.sale===null?null:(cents(next.sale)-cents(next.purchase))/100;const cell=tr.querySelector('[data-profit]');cell.className='amount '+(profit===null?'muted':color(profit));cell.textContent=profit===null?'—':(profit>0?'+':'')+money(profit);tr.querySelector('[data-status]').innerHTML=`<span class="status ${next.sale===null?'held':'sold'}">${next.sale===null?'持有中':'已出售'}</span>`;if(!filtered().some(record=>record.id===next.id))renderRows();else totals();renderDashboard();}catch(error){input.value=original[field]??'';toast(error.message);}});
  $('rows').addEventListener('click',event=>{const button=event.target.closest('[data-delete]');if(!button)return;const record=records.find(record=>record.id===button.closest('tr').dataset.id);if(record&&confirm(`删除“${record.name}”？`)&&save(records.filter(item=>item.id!==record.id))){render();toast('已删除');}});
  $('search').addEventListener('input',renderRows);$('filter').addEventListener('change',renderRows);
  function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  $('export').addEventListener('click',()=>{try{const text=locked?localStorage.getItem(KEY):JSON.stringify(payload(records),null,2);if(text===null)throw new Error('没有可导出的数据');download(text,`龙粗账本${locked?'-原始数据':''}-${new Date().toISOString().slice(0,10)}.json`);}catch(error){toast(error.message);}});
  $('import').addEventListener('click',()=>$('import-file').click());
  $('import-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;try{if(file.size>10*1024*1024)throw new Error('备份文件超过 10 MB');const next=decode(JSON.parse(await file.text()));if((records.length||locked)&&!confirm(`导入 ${next.length} 条记录，将替换当前账本。继续吗？`))return;const wasLocked=locked;locked=false;if(save(next)){$('search').value='';$('filter').value='all';render();toast(`已导入 ${next.length} 条记录`);}else locked=wasLocked;}catch(error){toast('导入失败：'+error.message);}});
  window.addEventListener('storage',event=>{if(event.key!==KEY)return;locked=true;warning('账本已在另一个页面变更。请刷新此页后继续，避免覆盖。');});
  render();
})();
</script>
</body>
</html>
